name: "Vyndor Home"
version: "0.1.2"
slug: "vyndor_home"
description: "Local Vyndor Smart Living runtime, dashboard, Home Assistant integration and secure Display access."
url: "https://github.com/Valcked/vyndor-home-assistant-addons"

image: "ghcr.io/valcked/vyndor-home"

arch:
  - amd64

startup: application
boot: auto
init: false

hassio_api: true
hassio_role: default
homeassistant_api: true

# Vyndor Home discovers and advertises physical Vyndor Displays
# on the customer LAN using mDNS/Bonjour.
host_network: true

ingress: true
ingress_port: 8099
ingress_stream: true

panel_title: "Vyndor Home"
panel_icon: "mdi:home-automation"
panel_admin: true

environment:
  VYNDOR_HA_MODE: "supervisor"
  VYNDOR_DATA_DIR: "/data"

stage: experimental
backup: cold
